name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.VWs8QXjHRZHZXSTUU3eL4pz1YKxIMdLrjKE37ob8 }}
          aws-secret-access-key: ${{ secrets.AKIAYXXHE2YLO5ZCFL37 }}
          aws-region: ${{ ap-south-1 }}

      - name: Deploy to S3
        run: |
          aws s3 sync . s3://${{ secrets.rajesh0101010  }} \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md" \
            --delete

      - name: Success
        run: echo "✅ Deployed to S3 successfully!"
